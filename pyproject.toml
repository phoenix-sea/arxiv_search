[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arxiv-search"
version = "0.1.0"
description = "Self-hosted arXiv index with affiliations, Gemini interest check, Telegram alerts and a search UI"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "jinja2>=3.1",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "pypdf>=4",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
arxiv-search = "arxiv_search.cli:main"

[tool.setuptools.packages.find]
include = ["arxiv_search*"]

[tool.setuptools.package-data]
arxiv_search = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
